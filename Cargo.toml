[workspace]
resolver = "2"
members = [
  "crates/collab-circuit",
  "crates/collab-core",
  "crates/collab-calendar",
  "crates/collab-documents",
  "crates/collab-archive",
  "crates/collab-live",
  "crates/collab-net-policy",
  "crates/collab-protocol",
  "crates/collab-replica",
  "crates/collab-server",
  "crates/collab-sheet",
  "crates/collab-vault-domain",
  "src-tauri",
]

# Debug builds ship the same native library the release build does, just built
# with the dev profile — so an unoptimized `opt-level = 0` build of every
# dependency runs behind every IPC call on device. Cryptography and parsing are
# the worst affected — AES-GCM measured ~65x slower unoptimized (220ms vs 3.4ms
# per MiB) and calendar recurrence projection ~4x — so the Android debug APK
# feels broken while the release APK is fine.
#
# Dependencies are compiled once and rarely change, so they are optimized fully;
# the workspace's own crates keep a light optimization level that preserves fast
# incremental rebuilds. `debug-assertions` and `overflow-checks` stay on — this
# trades build time for runtime, not correctness checks.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.package]
version = "0.7.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
rand = "0.8"
regex = "1"
quick-xml = "0.41"
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid", "chrono"] }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
unicode-normalization = "0.1"
url = "2.5"
yrs = "0.27"
zip = "2"
