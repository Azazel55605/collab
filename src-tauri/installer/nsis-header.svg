<svg xmlns="http://www.w3.org/2000/svg" width="150" height="57" viewBox="0 0 150 57">
  <title>NSIS installer header</title>
  <desc>Shown at the top right of every NSIS page. NSIS draws no text over it, so the whole surface is usable.</desc>
  <defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F6C9E"/><stop offset="1" stop-color="#58BCEC"/></linearGradient></defs>
  <rect width="150" height="57" fill="url(#band)"/>
  <g fill="#FFFFFF">
    <rect x="108" y="16" width="20" height="24" rx="6" fill-opacity="0.16"/>
    <rect x="116" y="10" width="20" height="24" rx="6" fill-opacity="0.22"/>
  </g>
  <text x="14" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="500" fill="#FFFFFF">collab</text>
</svg>
