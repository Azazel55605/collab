<svg xmlns="http://www.w3.org/2000/svg" width="493" height="58" viewBox="0 0 493 58">
  <title>WiX installer banner</title>
  <desc>
    Top banner of the MSI dialogs. WiX draws the dialog title and subtitle in black
    over the left of this strip, so that area stays white; the mark sits on the right.
  </desc>
  <defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F6C9E"/><stop offset="1" stop-color="#58BCEC"/></linearGradient></defs>
  <rect width="493" height="58" fill="#FFFFFF"/>
  <rect x="345" width="148" height="58" fill="url(#band)"/>
  <g fill="#FFFFFF">
    <rect x="392" y="18" width="22" height="26" rx="7" fill-opacity="0.16"/>
    <rect x="401" y="12" width="22" height="26" rx="7" fill-opacity="0.22"/>
  </g>
  <text x="440" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="500" fill="#FFFFFF">collab</text>
</svg>
