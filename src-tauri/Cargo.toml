[package]
name = "collab"
version = "0.7.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "collab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
gtk = "0.18"
glib = "0.18"
gtk-sys = "0.18"
tauri-plugin-drag = "2.1.1"
# Both Linux keyring backends: kernel keyutils (silent default) and D-Bus Secret
# Service (durable, opt-in). The backend is chosen at runtime in commands/server.rs.
keyring = { version = "3", features = ["sync-secret-service", "linux-native"] }

[dependencies]
collab-archive = { path = "../crates/collab-archive" }
collab-circuit = { path = "../crates/collab-circuit" }
collab-calendar = { path = "../crates/collab-calendar" }
collab-core = { path = "../crates/collab-core" }
collab-documents = { path = "../crates/collab-documents" }
collab-live = { path = "../crates/collab-live" }
collab-net-policy = { path = "../crates/collab-net-policy" }
collab-protocol = { path = "../crates/collab-protocol" }
collab-replica = { path = "../crates/collab-replica" }
collab-sheet = { path = "../crates/collab-sheet" }
collab-vault-domain = { path = "../crates/collab-vault-domain" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { workspace = true, features = ["sqlite"] }
tokio = { version = "1", features = ["full"] }
notify = "6"
notify-debouncer-mini = "0.4"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz.workspace = true
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
parking_lot = "0.12"
fuzzy-matcher = "0.3"
zip = "2"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.24"
url = "2.5"
tempfile = "3"
reqwest-websocket = { version = "0.5", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

# Windows/macOS use their native OS keystore (Credential Manager / Keychain),
# which is silent and durable, so they never pull in the D-Bus dependency.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-drag = "2.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-drag = "2.1.1"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

[dev-dependencies]
httpmock = "0.7"
