verifyDepsBeforeRun: false

# Transitive advisory fixes. Every entry here raises a dependency to a version
# its own parent's semver range already permits, so it is a forced dedupe rather
# than an unsupported upgrade. An advisory whose fix falls outside what the
# parent declares does not belong here — it needs the parent upgraded instead.
#
# Deliberately absent: esbuild (fixed in 0.28, outside vite's ^0.27.0). It is
# low-severity and build-time only; it needs vite upgraded rather than an
# override forcing a version the parent never claimed to support.
#
# @babel/core no longer needs an entry: its fix landed in 7.29.1, inside what
# @vitejs/plugin-react declares, so a plain lockfile update resolves it and
# carries browserslist and baseline-browser-mapping along with it.
overrides:
  '@hono/node-server@>=1.0.0 <1.19.15': 1.19.15
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': 1.31.0
  'body-parser@>=2.0.0 <2.3.0': 2.3.0
  'brace-expansion@>=3.0.0 <5.0.12': 5.0.12
  # mermaid declares ^3.3.3 and so already permits this; without the override
  # pnpm keeps a second, older copy alongside our direct dependency.
  'dompurify@>=3.0.0 <3.4.16': 3.4.16
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'hono@>=4.0.0 <4.13.7': 4.13.7
  'ip-address@>=10.0.0 <10.7.1': 10.7.1
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'linkify-it@<=5.0.1': 5.0.2
  'nanoid@<3.3.18': 3.3.18
  'postcss@<=8.5.22': 8.5.23
  'postcss-selector-parser@>=7.0.0 <7.1.6': 7.1.6
  'qs@>=6.0.0 <6.16.0': 6.16.0
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'undici@>=7.0.0 <7.30.0': 7.30.0

allowBuilds:
  esbuild: true
  msw: true
  tesseract.js: true

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch

# pnpm audit matches registry versions and cannot inspect patched package
# contents. This advisory is mitigated by the reproducible patch above and its
# regression test; remove the ignore when a fixed upstream release exists.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
