[workspace]
resolver = "2"
members = [
  "crates/collab-circuit",
  "crates/collab-core",
  "crates/collab-calendar",
  "crates/collab-documents",
  "crates/collab-archive",
  "crates/collab-live",
  "crates/collab-net-policy",
  "crates/collab-protocol",
  "crates/collab-replica",
  "crates/collab-server",
  "crates/collab-vault-domain",
  "src-tauri",
]

[workspace.package]
version = "0.6.7"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
rand = "0.8"
regex = "1"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid", "chrono"] }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
unicode-normalization = "0.1"
url = "2.5"
yrs = "0.27"
zip = "2"
