name: Build

# Triggers:
#   - Push a tag like desktop-v1.2.3  → builds all targets and creates a GitHub Release
#   - workflow_dispatch       → manual run from the Actions tab (no release created)
on:
  push:
    tags:
      - 'desktop-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write   # required to create GitHub Releases
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ─────────────────────────────────────────────────
          - platform:       ubuntu-22.04
            rust-target:    x86_64-unknown-linux-gnu
            artifact-label: linux-x86_64

          # ── Linux aarch64 ────────────────────────────────────────────────
          # ubuntu-24.04-arm is GitHub's native ARM64 runner (free for public repos)
          - platform:       ubuntu-24.04-arm
            rust-target:    aarch64-unknown-linux-gnu
            artifact-label: linux-aarch64

          # ── Windows x86_64 ───────────────────────────────────────────────
          - platform:       windows-latest
            rust-target:    x86_64-pc-windows-msvc
            artifact-label: windows-x86_64

          # ── macOS Apple Silicon ──────────────────────────────────────────
          - platform:       macos-latest   # macos-14+ = M1 runner
            rust-target:    aarch64-apple-darwin
            artifact-label: mac-apple-silicon

          # ── macOS Intel ──────────────────────────────────────────────────
          # Cross-compiled on the same ARM runner: macOS ships both SDKs, so
          # Intel needs no separate runner image and no image that GitHub is
          # phasing out.
          - platform:       macos-latest
            rust-target:    x86_64-apple-darwin
            artifact-label: mac-intel

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.artifact-label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.mjs --target desktop "${{ github.ref_name }}"

      # ── Node / pnpm ───────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ── Rust ──────────────────────────────────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # The repo root is now a Cargo workspace; Cargo.lock and the shared
          # target/ directory live here, not under src-tauri.
          workspaces: .

      # ── Linux system dependencies ─────────────────────────────────────────
      # Required by WebKitGTK / Tauri on Linux (same packages for x86 and arm)
      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ── Tauri build ───────────────────────────────────────────────────────
      # TAURI_SIGNING_PRIVATE_KEY is required by tauri-plugin-updater to sign
      # each bundle. The .sig files it produces are uploaded alongside installers
      # and referenced in latest.json so the in-app updater can verify downloads.
      - name: Build
        run: pnpm tauri build --target ${{ matrix.rust-target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── macOS bundle names ────────────────────────────────────────────────
      # Tauri names the updater bundle after the product alone
      # ("collab.app.tar.gz"), regardless of target architecture. With two macOS
      # jobs, both would upload a different bundle under that one name and the
      # second would replace the first in the release. Make the name carry the
      # architecture. The .dmg files already differ (_x64 vs _aarch64).
      - name: Disambiguate macOS bundle name
        if: contains(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          bundle_dir="target/${{ matrix.rust-target }}/release/bundle/macos"
          src="$bundle_dir/collab.app.tar.gz"
          dest="$bundle_dir/collab-${{ matrix.artifact-label }}.app.tar.gz"

          if [ ! -f "$src" ]; then
            echo "Expected updater bundle $src was not produced by the build." >&2
            exit 1
          fi
          mv "$src" "$dest"

          if [ -f "$src.sig" ]; then
            mv "$src.sig" "$dest.sig"
          else
            echo "::warning::No signature next to $src; this platform will be skipped in latest.json."
          fi

      - name: Package portable Linux archive
        if: contains(matrix.platform, 'ubuntu')
        run: |
          mkdir -p dist-portable
          cp target/${{ matrix.rust-target }}/release/collab dist-portable/collab
          cat > dist-portable/README.txt <<'EOF'
          collab portable Linux build

          This archive runs against the host system WebKitGTK/GTK libraries. Use it when
          the .deb / .rpm packages or the Flatpak bundle are not practical on your distro.

          Run:
            ./collab
          
          Requirements:
            Install the normal Tauri/WebKitGTK runtime packages for your distro.
          EOF
          tar -C dist-portable -czf collab-${{ matrix.artifact-label }}-portable.tar.gz .

      # ── Publish GitHub Release (tag pushes only) ───────────────────────────
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft:      true
          prerelease: false
          name:       'collab ${{ github.ref_name }}'
          body: |
            Linux download order:
            1. Use the `.deb` build on Debian/Ubuntu-based systems.
            2. Use the `.rpm` build on Fedora/openSUSE/RHEL-based systems.
            3. Use the Flatpak bundle (`collab-flatpak-x86_64.flatpak`) or `collab-linux-*-portable.tar.gz` on other desktop distros.

            Native packages, the Flatpak bundle, and the portable tarball provide the best touchpad scrolling, blur/compositing, and scaling behavior on Linux.

            Linux install guide: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/build/linux-install.md

            ---

            macOS download order:
            1. On an Apple Silicon Mac (M1 and newer), use `collab_<version>_aarch64.dmg`.
            2. On an Intel Mac, use `collab_<version>_x64.dmg`.

            The Apple menu → About This Mac shows which chip a machine has.

            Neither build is **code-signed or notarized**, so macOS Gatekeeper will refuse to open them by default ("collab is damaged and can't be opened"). After moving `collab.app` to `/Applications`, clear the quarantine flag once:

            ```
            xattr -cr /Applications/collab.app
            ```

            Then open the app normally. See the macOS install guide: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/build/macos-install.md
          files: |
            target/${{ matrix.rust-target }}/release/bundle/**/*.deb
            target/${{ matrix.rust-target }}/release/bundle/**/*.deb.sig
            target/${{ matrix.rust-target }}/release/bundle/**/*.rpm
            target/${{ matrix.rust-target }}/release/bundle/**/*.rpm.sig
            target/${{ matrix.rust-target }}/release/bundle/**/*.msi
            target/${{ matrix.rust-target }}/release/bundle/**/*.msi.sig
            target/${{ matrix.rust-target }}/release/bundle/**/*.exe
            target/${{ matrix.rust-target }}/release/bundle/**/*.exe.sig
            target/${{ matrix.rust-target }}/release/bundle/**/*.dmg
            target/${{ matrix.rust-target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.rust-target }}/release/bundle/**/*.app.tar.gz.sig
            collab-${{ matrix.artifact-label }}-portable.tar.gz

      # ── Collect artifacts (all runs) ───────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-label }}
          if-no-files-found: warn
          path: |
            target/${{ matrix.rust-target }}/release/bundle/**/*.deb
            target/${{ matrix.rust-target }}/release/bundle/**/*.deb.sig
            target/${{ matrix.rust-target }}/release/bundle/**/*.rpm
            target/${{ matrix.rust-target }}/release/bundle/**/*.rpm.sig
            target/${{ matrix.rust-target }}/release/bundle/**/*.msi
            target/${{ matrix.rust-target }}/release/bundle/**/*.msi.sig
            target/${{ matrix.rust-target }}/release/bundle/**/*.exe
            target/${{ matrix.rust-target }}/release/bundle/**/*.exe.sig
            target/${{ matrix.rust-target }}/release/bundle/**/*.dmg
            target/${{ matrix.rust-target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.rust-target }}/release/bundle/**/*.app.tar.gz.sig
            collab-${{ matrix.artifact-label }}-portable.tar.gz

  flatpak:
    name: flatpak-x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtimes and SDK extensions
        run: |
          flatpak install --user -y flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.node22//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build Flatpak repo
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean flatpak-build flatpak/com.azazel.collab.yml
          flatpak-builder --repo=flatpak-repo --force-clean flatpak-build flatpak/com.azazel.collab.yml

      - name: Bundle Flatpak
        run: |
          flatpak build-bundle flatpak-repo collab-flatpak-x86_64.flatpak com.azazel.collab --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-x86_64
          if-no-files-found: error
          path: |
            collab-flatpak-x86_64.flatpak
            flatpak/com.azazel.collab.yml
            flatpak/com.azazel.collab.desktop
            flatpak/com.azazel.collab.metainfo.xml

      - name: Release Flatpak bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: |
            collab-flatpak-x86_64.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Update manifest ─────────────────────────────────────────────────────────
  # Runs after all matrix builds finish. Downloads their artifacts, generates
  # latest.json (required by tauri-plugin-updater), and uploads it to the release.
  publish:
    name: Publish update manifest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Generate latest.json
        run: node scripts/generate-update-manifest.mjs
        env:
          TAG: ${{ github.ref_name }}

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
