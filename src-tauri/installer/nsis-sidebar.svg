<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <title>NSIS welcome and finish sidebar</title>
  <desc>Full-bleed panel on the NSIS welcome and finish pages. NSIS draws its text to the right of it, so the whole surface is usable.</desc>
  <defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F6C9E"/><stop offset="1" stop-color="#58BCEC"/></linearGradient></defs>
  <rect width="164" height="314" fill="url(#band)"/>
  <g fill="#FFFFFF">
    <rect x="30" y="118" width="70" height="84" rx="20" fill-opacity="0.14"/>
    <rect x="58" y="100" width="70" height="84" rx="20" fill-opacity="0.20"/>
    <path d="M100 112h18v18" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M78 138h26M78 152h17" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="4"
          stroke-linecap="round"/>
  </g>
  <text x="24" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="500" fill="#FFFFFF">collab</text>
  <text x="24" y="264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11" fill="#FFFFFF" fill-opacity="0.8">Local-first notes,</text>
  <text x="24" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11" fill="#FFFFFF" fill-opacity="0.8">built to collaborate</text>
</svg>
