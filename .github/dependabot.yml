version: 2

# Grouped, low-frequency updates. The Security Scan workflow already reports
# advisories; these pull requests are what actually closes them.
#
# Grouping is by update type, not by package family. The previous per-family
# split left every major on its own and produced thirteen open pull requests in
# the first run — seven of them single major bumps. A repository that floods its
# own pull request list gets its dependency automation switched off.
updates:
  # One entry, both npm directories: `directories` (plural) lets Dependabot
  # combine updates across paths into shared pull requests instead of running
  # two separate streams for the root and the admin interface.
  - package-ecosystem: npm
    directories:
      - '/'
      - '/apps/admin-web'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: dependabot
      prefix-development: dependabot(dev)
    ignore:
      # A TypeScript major would break linting on the first file: typescript-eslint
      # 8.68 declares `peer typescript >=4.8.4 <6.1.0`, and the repository runs
      # 5.8.3. Drop this once typescript-eslint supports the next major.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm-all:
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-majors:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: dependabot
    groups:
      cargo-all:
        patterns: ['*']
        update-types: ['minor', 'patch']
      cargo-majors:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: dependabot
    groups:
      actions-all:
        patterns: ['*']

  # Base images in Dockerfile.server. Monthly: these move slowly, and a major
  # here means a new PostgreSQL or Node line, which is a deliberate decision
  # rather than a routine bump.
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: dependabot
    groups:
      docker-all:
        patterns: ['*']
